    - session_data
  notes: 通过严格 Typert Remote 读取模型目录和 llm-pi-ai 设置，并写入或删除指定 Provider 的 models 数组；不读取 API Key、不执行命令，也不会新建 Provider 凭据
  data_flow: DSH 内置/已配置模型目录 → 模型 Pro 页面 → 用户确认的模型字段 → Settings service 对 llm-pi-ai/providers/<route>/models 的结构化 mutate；删除最后一个内置目录条目时回退目录继承。
risk_level: high
verification:
  level: source_reviewed
  verified_on: 2026-08-22
  independent_review: true
  review_notes: 已审阅固定提交的 Host Runtime、Typert 严格参数描述、模型字段校验、目录快照、覆盖与删除逻辑。实现会在首次显式编辑时把当前目录整体固化为 models 快照，并保护原有未知字段和自定义 Provider 的最后条目；但写错 contextWindow、maxTokens、推理 wire 或 compat 可能导致模型调用失败，且快照后不会自动合并上游目录更新。修改前备份 settings，在独立 Profile 验证目标模型，升级后重新对比目录。
summary:
  zh: 在 DSH 设置页集中查看、新建、复制、编辑和删除 llm-pi-ai Provider 的显式模型条目，包括上下文、输出上限、输入模态和推理兼容参数。
