  compatibility_notes: 插件版本 2.5.4、BSD-3-Clause，要求 Node.js >=22.5，开发依赖面向 DSH 0.1.0-rc.7；本站完成固定提交静态审阅，未在当前 0.1.1-rc.2、真实公网、Let's Encrypt、systemd 重启、Windows ACL 或多用户并发下运行
category: security
topics:
  - security
permissions:
  status: reviewed
  capabilities:
    - network_access
    - credentials
    - browser_control
    - remote_control
    - ui_injection
  notes: 默认在 0.0.0.0 启动外部 HTTPS 网关，代理 DSH HTTP/WebSocket，管理用户、JWT、目录、上传、Git、Sandbox、配额和消息；还会对已安装 DSH 客户端 bundle 打补丁，并可重启配置的 systemd 服务
  data_flow: 远程浏览器请求 → TLS 网关、CSRF/JWT、角色与细粒度权限检查 → loopback DSH Web/API/WebSocket → 结果返回用户；用户、审计和用量进入加密 SQLite，密钥保存于 0600 .env，首次配置后自动轮换 setup key。
risk_level: high
verification:
  level: source_reviewed
  verified_on: 2026-08-22
  independent_review: true
  review_notes: 已审阅固定提交的配置、首次初始化、登录/JWT、CSRF、内部密钥、字段加密、权限过滤、代理和补丁/重启逻辑。实现包含强密码、bcrypt、失败锁定、IP 节流、SameSite/HttpOnly、同源写路由、AES-GCM 字段加密和固定回环内部接口；但公网身份网关和 DSH bundle 补丁都是高影响边界，配置错误可能暴露 Agent 或破坏升级兼容。上线前先在隔离主机备份 DSH/Profile，固定域名与 TLS，封锁上游 3080 公网访问，创建最小权限子用户，并在每次 DSH 升级后重新审计补丁。
summary:
  zh: 为 DSH Web 增加带 HTTPS、JWT、管理员与子用户权限、目录限制、用量配额、审计和消息功能的远程访问密码网关。
  en: "Turns DeepSeek Harness into a server-grade multi-tenant platform: remote access + auto HTTPS, subuser permissions & token/daily quotas, sandbox enforcement, encrypted auth & audit log."
