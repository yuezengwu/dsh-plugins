permissions:
  status: reviewed
  capabilities:
    - filesystem_read
    - filesystem_write
    - command_execution
    - credentials
    - session_data
  notes: 读取 Session 投影与持久化事件以统计 Token；私有 loopback RPC 可写滚动预算，并按用户显式选择的 Provider/Model 发起额外分析调用，不执行命令或修改工作区
  data_flow: DSH Session 事件和 Provider Token 桶 → 本地投影、聚合与仪表盘；用户触发分析时仅把匿名路由、计数、日期及允许列表内的轨迹元数据 → 所选模型 → Markdown 报告返回本机 Web。
risk_level: high
verification:
  level: source_reviewed
  verified_on: 2026-08-22
  independent_review: true
  review_notes: 已审阅固定提交的投影、历史预热、loopback RPC、预算设置、用量分析和轨迹脱敏。聚合分析会移除真实 Provider/Model ID，轨迹分析不发送提示、回复、工具参数或结果正文，并限制输入长度和并发；但启用模型分析仍会把用量/行为元数据发给所选 Provider、产生额外 Token 和费用，历史预热也可能消耗本机资源。敏感环境应只选获批 Provider，先在小型 Profile 验证性能，并把报告视为技术分析而非账单或合规证明。
summary:
  zh: 为 DSH 持久记录并可视化 Token 用量、模型与日期分布、预算进度，并可调用用户选择的模型生成聚合用量和会话轨迹分析。
  en: "Local-first four-bucket Token observability: persistent session/provider/model/day dashboards, trends, budget and anomaly signals, public-rate estimates, safe aggregate exports, and explicit opt-in usage or session-trajectory analysis."
