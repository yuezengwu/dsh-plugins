  compatibility_notes: 插件版本 0.2.3，仅适用于 Windows 与已安装的 WSL；dsh-fs、shell、subprocess 等 peer 使用通配范围，未锁定具体 DSH 版本；本站完成固定提交静态审阅，未在不同 WSL 发行版、用户、drvfs/9P 或 Windows 版本上实测
