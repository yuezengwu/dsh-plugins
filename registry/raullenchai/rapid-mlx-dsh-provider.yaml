    - command_execution
    - network_access
    - remote_control
  notes: 向配置的 OpenAI 兼容 Rapid-MLX endpoint 发送对话和工具 schema；可通过 DSH subprocess 以参数数组调用 rapid-mlx pull 或 rm -y 下载、缓存和删除本地模型
  data_flow: DSH 对话、图片引用和工具定义 → 配置的 Rapid-MLX /v1/chat/completions → 流式文本/工具调用返回 Agent；模型管理工具 → DSH subprocess → 本机 rapid-mlx CLI 与模型缓存。
risk_level: high
verification:
  level: source_reviewed
  verified_on: 2026-08-22
  independent_review: true
  review_notes: 已审阅固定提交的 Provider、请求适配、模型发现和管理工具。CLI 使用参数数组而非拼接 shell，删除目标来自结构化工具参数；但 remove 会直接执行 -y 删除模型，pull 会消耗大量带宽与磁盘，且自定义 baseURL 可以是远程 HTTP 服务并接收完整提示词、图片和工具定义。默认保持 loopback endpoint，对 pull/remove 启用人工审批，删除前核对模型名和缓存位置。
summary:
  zh: 把本机 Rapid-MLX 服务接入 DSH，自动发现已服务模型，并提供健康检查、缓存状态、模型拉取和删除工具。
