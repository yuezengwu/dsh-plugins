  notes: 把用户搜索词发送给选定或回退的外部搜索服务，可读取 Exa、Tavily、Keenable、Perplexity 与 DeepSeek 密钥；回环设置路由还可修改插件配置并执行固定的 pnpm add dsh-free-search@latest 自更新命令
  data_flow: DSH 搜索请求与可选时间范围 → 本机缓存和引擎选择 → 外部搜索/MCP/模型端点 → 来源、摘要与实际 Provider 返回 Agent；API Key 从 settings、credentials 或环境变量读取，只以已配置状态返回页面。
risk_level: high
verification:
  level: source_reviewed
  verified_on: 2026-08-22
  independent_review: true
  review_notes: 已审阅固定提交的各引擎请求、30 秒总预算、缓存、密钥解析、脱敏设置桥和自更新。设置、搜索测试和更新路由只接受 POST 与 loopback socket，请求变量没有进入更新 shell；但同一查询可能在失败回退时依次发送给多家第三方，匿名服务仍可记录 IP/查询，自更新直接安装 latest 也不满足固定版本供应链要求。敏感查询禁用自动回退并选择可信自建 SearXNG，密钥使用 credentials，生产环境不要使用一键 latest 更新。
summary:
  zh: 为 DSH 提供 DuckDuckGo、Bing、SearXNG、AnySearch、Exa、Tavily、Keenable、Perplexity 和 DeepSeek 等多引擎 Web 搜索，支持匿名额度、密钥、回退、缓存、时间过滤与引擎测试。
  en: "Free, keyless web search for DSH: 7 engines (DuckDuckGo/Bing/SearXNG free + Exa/Perplexity/DeepSeek paid), auto-failover, settings-page UI with API key inputs and official links, web_fetch, and an engine test tool."
