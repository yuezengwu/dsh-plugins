  compatibility_notes: 插件版本 0.15.1、MIT，要求 Node.js ^22.19 或 >=24；peer 要求 Cordis >=4 <5、fs-local/fs-sandbox rc.5..<0.2、subprocess-local rc.5..<rc.7，README 主要按 DSH rc.6 验证；本站完成固定提交静态审阅，未在当前 0.1.1-rc.2、真实 Windows 10/11、WSL、企业 EDR 或全部 Shell 组合下运行
