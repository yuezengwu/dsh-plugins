dsh:
  kind: plugin
  compatibility_status: declared
  compatibility_notes: 插件版本 0.1.4、MIT，要求 Node.js ^22.19 或 >=24，主要 DSH peer 限定 >=0.1.0-rc.7 <0.1.0-rc.9；本站完成固定提交静态审阅，当前站点跟踪的 0.1.1-rc.2 超出声明范围，未做安装、账号 OAuth、自托管 Connector 或真实外部 Action 验证
category: integration
topics:
  - tools
  - integration
permissions:
  status: reviewed
  capabilities:
    - network_access
    - credentials
    - browser_control
    - remote_control
    - ui_injection
  notes: Host 从 DSH Credentials 或启动环境解析 Connector Client Key，通过 loopback Connection RPC 向浏览器只返回状态和已净化账号信息；Agent 经 MCP 调用外部 Provider Action，连接/断开/默认账号等操作会改变 OOMOL 账号连接状态
  data_flow: 用户保存的 Connector Key留在 Host → HTTPS OOMOL/OpenConnector MCP 建立工具发现与执行通道 → Agent 选择 Action、账号和参数并把任务数据发送到对应 Provider → 结果返回 DSH；账号管理面经 loopback RPC 调用固定 OOMOL /v1 路由，Provider 凭据由 Connector 保存。
risk_level: high
verification:
  level: source_reviewed
  verified_on: 2026-08-22
  independent_review: true
  review_notes: 已审阅固定提交的 endpoint 校验、Credentials Seam、loopback RPC、MCP 客户端、连接管理、响应净化和外部 Console 边界。远程端点强制 HTTPS，HTTP 只允许 loopback，URL 拒绝嵌入凭据和 fragment，浏览器不接收 Connector Key；但插件可把用户数据发送给众多第三方 Provider，连接与执行动作可能具有破坏、公开发布、权限变更或广泛共享副作用，当前尚无 action-aware 强制审批。先解决版本兼容，在执行前核对 Provider、账号、Action、参数和权限，对外发布或删除类动作保持人工确认，并按外部服务条款管理数据。
summary:
  zh: 把 OOMOL Hosted 或自托管 OpenConnector 接入 DSH，使 Agent 可以发现并执行外部 Provider Action，并在原生面板管理 OOMOL 账号连接。
  en: Connects DeepSeek Harness to OOMOL-managed apps and services, with progressive Connector Action discovery and execution plus an in-app panel for managing Provider connections.
