license:
  spdx: BSD-3-Clause
  status: clear
dsh:
  kind: plugin
  compatibility_status: declared
  compatibility_notes: 插件版本 0.8.0、BSD-3-Clause，要求 Node.js >=22.19，DSH peer 使用宽版本范围；本站完成固定提交静态审阅，未在当前 0.1.1-rc.2、真实多角色并发、长任务、崩溃恢复、GUI 或数据库迁移下运行
category: agent
topics:
  - workflow
  - agent
permissions:
  status: reviewed
  capabilities:
    - credentials
    - session_data
    - ui_injection
  notes: 默认 GUI 端口为 0、不启动 Web 服务；受治理 worker 以 territory cwd 创建 DSH Session，强制 workspace-write、approval=never 和受限工具集，无法强制边界时在派发前失败。模型管理工具仍可创建指向任意绝对路径的领地并分配角色/任务，默认 declarative 认证只表达角色而不验证真实调用者
  data_flow: 领地路径、角色、任务、能力租约与审计 → 本机 SQLite 治理数据库 → 一次性受限 DSH worker 在指定领地执行 → 产出、复核、状态和审计回写数据库；默认无外部传输，可选 GUI 仅监听 127.0.0.1。
risk_level: high
verification:
  level: source_reviewed
  verified_on: 2026-08-22
  independent_review: true
  review_notes: 已审阅固定提交的领地/绑定/任务服务、能力解析、受治理执行器、DSH 后端和可选 GUI。worker 在无法落实工具/Sandbox 限制时失败关闭，GUI 默认关闭；但 declarative 不是身份认证，领地路径决定可写范围，force-delete 会改变治理记录和运行状态。若启用 GUI，默认空 Token 与 guiAllowOrigins=['*'] 并不安全，自定义请求头也不能代替 CSRF/身份校验。生产环境使用 session-bound 模式，只登记可信工作区；GUI 保持关闭，或设置高强度 Token 与精确 Origin，再通过防火墙限制真实回环访问。
summary:
  zh: 用本地 SQLite 建立面向多 Agent 的 Kingdom 治理层，管理领地、角色、任务生命周期、能力租约、一次性工作进程、复核和审计记录。
  en: "Agent governance kingdom for DeepSeek Harness: territories, role bindings (bind/unbind/session with model/agent identity), and a plan→assign→execute→review task loop where Worker claims never auto-complete (Claim ≠ Fact), with a local GUI operations console."
