  compatibility_notes: 插件版本 0.3.7、MIT，要求 Node.js ^22.19 或 24+，DSH client peer >=0.1.0-rc.5 <0.2.0；本站完成固定提交静态审阅，未在当前 0.1.1-rc.2、真实公网隧道、多设备审批、SSE/WebSocket 或 TLS 终止环境运行
category: remote
topics:
