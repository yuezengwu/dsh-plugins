package:
  ecosystem: npm
  name: dsh-miraculous-standard
  version: 2.0.0
  install_spec: github:rinDBeans/dsh-miraculous-standard#9b54d1768143
license:
  spdx: MIT
  status: clear
dsh:
  kind: plugin
  compatibility_status: declared
  compatibility_notes: 插件版本 2.0.0、MIT，README 面向 DSH 0.1.0-rc.7 并称 rc.5/rc.6 可运行，未声明 package peer；本站完成固定提交静态审阅，当前站点跟踪的 0.1.1-rc.2 不在作者明确测试线，未复现实验中的轨迹、Token/缓存收益、Windows Shell 或长会话压缩行为
category: agent
topics:
  - agent
permissions:
  status: reviewed
  capabilities:
    - filesystem_write
    - command_execution
    - credentials
    - session_data
    - plugin_management
  notes: 安装器只向 $DSH_HOME/.agent-presets/miraculous-standard 写入缺失文件，不覆盖用户改动；预设会改变 System Prompt、首轮上下文和可见工具目录，并提供按需 Skill/工具解锁。Windows custom-bash 通过 DSH Subprocess 执行任意 Bash 命令，但作者明确说明其没有 OS 沙箱隔离
  data_flow: 当前 Agent 的模型 ID、Session 事件、压缩边界、工具目录和工作区指令文件位置 → 本机预设的上下文/目录过滤与短提示 → 后续模型请求；Skill 内容只在模型主动加载后进入下一步上下文。插件自身不联网、不采集遥测，也不复制模型凭据。
risk_level: high
verification:
  level: source_reviewed
  verified_on: 2026-08-22
  independent_review: true
  review_notes: 已审阅固定提交的非覆盖式安装器、Agent 组合、context gate、晋升/压缩状态、工具发现、Skill 加载、指令提示和 Windows custom-bash。它不注册公共 Web 路由、不外发数据，安装时也保留不同内容的本地文件；但首轮会主动隐藏运行时上下文和自动注入，包括工作区指令摘要，并用实验性 Persona/工具目录影响模型行为，失败时还可能回退暴露完整目录。Windows Bash 无 OS 沙箱，研究结论也不是普遍能力保证。先在非关键项目解决版本兼容，保留 DSH Approval，检查首轮是否仍遵守安全/项目规则，并以真实任务完成率、Token 和耗时验证，不把“锚定”宣传当成确定提升。
summary:
  zh: 为 DeepSeek V4 Pro/Flash 提供两阶段锚定 Agent 预设：首轮缩小工具与上下文，随后按模型晋升到常驻工具或完整 Standard 目录，并在压缩后重新收敛。
