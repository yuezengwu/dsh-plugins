license:
  spdx: MIT
  status: clear
dsh:
  kind: plugin
  compatibility_status: declared
  compatibility_notes: 插件版本 0.2.2、MIT，要求 Node.js ^22.19 或 24+，主要 DSH peer 从 0.1.0-rc.6 起；本站完成固定提交静态审阅，未在当前 0.1.1-rc.2、真实飞书租户、断线重连或多用户并发场景运行
category: remote
topics:
  - remote
permissions:
  status: reviewed
  capabilities:
    - command_execution
    - network_access
    - credentials
    - remote_control
    - session_data
  notes: 持有飞书 App Secret，通过远程消息创建或恢复完整 DSH Agent；实际文件、Shell、网络和其他工具权限由选择的 Agent Preset 与 Workspace 决定，访问范围由单聊策略、群白名单、用户白名单和 @ 规则限制
  data_flow: 飞书消息、聊天与话题标识 → 官方长连接 SDK、白名单和 @ 检查 → 按聊天隔离的 DSH Session、Workspace、Preset 与模型 → 最终回复返回原聊天或话题；Secret 进入 DSH credentials seam，原始 chat_id 经 SHA-256 后参与 Session 标识。
risk_level: high
verification:
  level: source_reviewed
  verified_on: 2026-08-22
  independent_review: true
  review_notes: 已审阅固定提交的配置、长连接通道、Agent 创建、凭据和本机设置路由。设置接口同时要求回环 socket、回环 Host、同源 Origin 与受限方法，Secret 不回显；群聊默认需要 @。但单聊默认开放，空群白名单不限制聊天，远程用户最终获得所选 Preset 的能力。生产使用应把 dmMode 改为 allowlist，配置 groupAllowlist/dmAllowlist、专用 workspace 和最小权限 Preset，敏感任务不要放在多人群聊中。
summary:
  zh: 通过飞书/Lark 官方 WebSocket 长连接把单聊、群聊和话题映射为 DSH Session，让远程用户继续使用 Harness 中配置的模型、工具、系统提示和会话存储。
