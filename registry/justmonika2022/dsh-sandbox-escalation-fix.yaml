  notes: 包装现有 Shell 和文件工具，按 Session 隐藏当前策略下不可用的 sandbox_permissions/justification，剔除无意义的同级升级参数，并清理不可能升级时的误导提示；不授予权限、不代替 Approval，也不执行文件或命令
  data_flow: Session Sandbox/Approval 状态与工具 Schema → Agent 作用域内的协作式 Wrapper → 投影后的工具参数、描述和结果提示 → 原工具继续执行；实际扩权仍完全走 DSH 原有 approveEscalation 与宿主策略。
risk_level: medium
verification:
  level: source_reviewed
  verified_on: 2026-08-22
  independent_review: true
  review_notes: 已审阅固定提交的版本门禁、目标工具验证、Schema/描述投影、参数归一化、结果清理、动态重绑与协作 Wrapper 协议。它不会把不可用权限变为可用，只删除与当前策略矛盾的模型输入和提示；但会在每个 Agent 作用域替换四个核心工具的可见定义，与其他工具包装/结果重写插件可能冲突。仅在声明支持的整套 DSH 版本使用，升级 DSH 前先禁用，并通过审计日志确认 Approval 行为未被其他插件改写。
summary:
  zh: 按每个 Session 的实际 Sandbox Mode 与 Approval Policy 修正 bash、pwsh、write、edit 的扩权参数和提示，避免模型在 All Access 或 approval=never 下反复提交无效升级请求。
