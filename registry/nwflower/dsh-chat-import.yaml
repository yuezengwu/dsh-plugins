dsh:
  kind: plugin
  compatibility_status: declared
  compatibility_notes: 插件版本 0.6.2，要求 Node.js >=22.13，peer 依赖以 DSH 0.1.0-rc.6 起步；本站完成固定提交静态审阅，未使用真实多平台历史、压缩会话或跨机器 bundle 做往返验证
category: tools
topics:
  - session
  - tools
permissions:
  status: reviewed
  capabilities:
    - filesystem_read
    - filesystem_write
    - session_data
  notes: 扫描并读取多个 Agent 在用户主目录和工作区中的完整转录、工具调用、思考、系统提示词与 Agent/Skill 配置；可写入 DSH Session、导出文件，并在显式开启后增量写回外部 Agent 历史
  data_flow: 本机外部 Agent 转录/数据库 → 格式识别、预算、敏感信息和结构校验 → 新 DSH Session 与可选预设/上下文 → DSH 续聊；导出或同步时，DSH 新增轮次 → 守卫与哈希检查 → Claude/Codex/Kimi/Grok 等目标文件。
risk_level: high
verification:
  level: source_reviewed
  verified_on: 2026-08-22
  independent_review: true
  review_notes: 已审阅固定提交的导入工具、来源发现、格式适配、预算、工作区映射、导出、同步和恢复实现。默认只读源记录、预览无副作用、导入新建 append-only 会话，写回默认关闭且使用 expectedHash/尾部守卫；但聊天历史通常含代码、路径、秘密和系统提示词，导入后会进入 DSH 会话并可能随模型请求外发，导出/双向同步也会修改其他 Agent 数据。建议先预览和脱敏，保持系统提示词与双向同步关闭，并只授权明确目录。
summary:
  zh: 把 Claude Code、Codex、ChatGPT、Cursor、Gemini、Grok、OpenClaw、Kimi、Qoder 等十余种 Agent 聊天历史导入 DSH，并支持导出、增量写回、双向同步和便携备份。
  en: Import full-fidelity chat histories from 13 coding agents (Claude Code, Codex, ChatGPT, Cursor, Gemini, opencode, and more) as resumable DeepSeek Harness sessions, with reverse export back to Claude Code.
