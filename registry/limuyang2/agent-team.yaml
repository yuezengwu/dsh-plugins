dsh:
  kind: plugin
  compatibility_status: declared
  compatibility_notes: 插件版本 0.1.3、MIT，要求 Node.js ^22.19 或 24+，主要 DSH peer 为 0.1.0-rc.7；本站完成固定提交静态审阅，未在当前 0.1.1-rc.2、多 Provider、高并发、长 Session 恢复或大仓库 Diff 下运行
category: agent
topics:
  - workflow
  - agent
permissions:
  status: reviewed
  capabilities:
    - filesystem_read
    - network_access
    - session_data
    - agent_orchestration
  notes: 用户可为每个独立 Agent 选择 DSH 权限 preset、模型、Skills 和 MCP，并在运行中切换权限；成员共享同一 Workspace，可读写文件、运行所选工具和互相派发任务，实际能力由各自 preset 决定
  data_flow: 用户目标与团队配置 → Leader 独立 Session 建任务和消息 → 成员独立 Session 在共享 Workspace 并行执行 → 状态、结果和消息回到 Leader/工作台；团队元数据持久化于插件 Store，外部文件复制到 Workspace 内 .agent-team/uploads。
risk_level: high
verification:
  level: source_reviewed
  verified_on: 2026-08-22
  independent_review: true
  review_notes: 已审阅固定提交的 Web transport、严格请求 schema、权限选择、Agent 创建、团队工具、Skill/MCP allowlist、Workspace 浏览/上传和路径围栏。上传使用 realpath containment、去路径文件名和独占写入，成员工具按选择过滤，权限沿用官方 preset；但本机 Web API 无独立登录且空 Origin 被接受，不能安全用于直接公网暴露，多 Agent 还会放大费用、并发写冲突和提示注入影响。保持 DSH loopback，默认使用 read-only/workspace-write，限制并发与 MCP，Leader 完成结果验收后再合并。
summary:
  zh: 在 DSH 中创建由独立根 Agent 组成的团队，让每个成员使用不同模型、Preset、权限、Skills 与 MCP，在共享工作区中由 Leader 分派任务和汇总结果。
  en: Multi-agent team collaboration for DeepSeek Harness with per-assistant models, skills, MCP servers, independent contexts, shared workspaces, task coordination, and conversation management.
