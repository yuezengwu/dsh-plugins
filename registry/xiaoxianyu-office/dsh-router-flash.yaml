  data_flow: 随包 Preset 固定文件 → DSH Home 目标目录内容比对与覆盖 → 用户选择 router-flash → 模型 ID 和首条用户消息本地分类 → Persona 与首轮核心工具投影；首个工具调用后恢复 Preset 的完整工具目录，不外发额外数据。
risk_level: high
verification:
  level: source_reviewed
  verified_on: 2026-08-22
  independent_review: true
  review_notes: 已审阅固定提交的 Preset 同步、路由分类、Persona 注入、首轮工具筛选、跨平台 Shell 和衍生来源 NOTICE。写入目标固定且只复制包内文件，不删除额外文件，也不会自动选择 Preset；但启动写 DSH Home 不经过逐次批准，升级会覆盖同名手改文件，Preset 在首个工具调用后开放完整 Standard/子 Agent/工作流能力，提示中的效果描述也只是作者经验。安装前备份同名 Preset，核对衍生许可链，在独立 Profile 选择使用，并保留宿主 Sandbox 与 Approval。
