  data_flow: 远端或内置 Registry → schema、来源和精确版本校验 → 本机 Typert Remote 设置页 → 用户操作队列、冲突检查与 Profile 备份 → pnpm/DSH 插件配置和重启；操作结果返回同一设置页。
risk_level: high
verification:
  level: source_reviewed
  verified_on: 2026-08-22
  independent_review: true
  review_notes: 已审阅固定提交的 Registry 客户端、安装位置、自动/引导安装、操作队列、冲突检查、Profile 写入、自更新和重启。它不暴露原始无保护 HTTP 管理路由，自动安装使用精确来源并关闭 lifecycle scripts，Agent 路径保留原生审批；但市场本质上拥有软件供应链和 Profile 管理权，远端 Registry 仍是可变信任源，卸载/更新/重启可能中断正在运行的任务。每次核对仓库、许可证和固定版本，先备份 Profile，高风险插件仍按本站源码审计结论决定是否安装。
summary:
