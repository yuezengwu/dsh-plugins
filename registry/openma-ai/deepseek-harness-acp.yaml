dsh:
  kind: plugin
  compatibility_status: declared
  compatibility_notes: 插件版本 0.4.19、Apache-2.0，要求 Node.js >=22.15，peer 覆盖 DSH ^0.1.0-rc.6 或 ^0.1.1-rc.1；本站完成固定提交静态审阅，未在当前 0.1.1-rc.2、真实 Zed、多客户端并发或各平台 Shell 下运行
category: integration
topics:
