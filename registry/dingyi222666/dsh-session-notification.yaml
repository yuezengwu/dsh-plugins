  compatibility_notes: 插件版本 0.1.1、BSD-3-Clause，未声明明确 DSH peer 版本；本站完成固定提交静态审阅，未在当前 0.1.1-rc.2、各主流浏览器、系统锁屏通知策略、长会话或大批并发 Session 下运行
category: interface
