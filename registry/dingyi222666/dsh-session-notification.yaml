permissions:
  status: reviewed
  capabilities:
    - filesystem_read
    - command_execution
    - network_access
    - browser_control
    - session_data
  notes: 浏览器端读取会话列表与对话快照、请求系统通知权限并播放提示音；自定义音频限制为 1MB 并以 data URL 保存在当前站点 localStorage，Host 端只注册设置 schema
  data_flow: DSH 会话状态与最后消息 → 浏览器本地判定通知类型 → 操作系统通知中心和可选音频；通知可能包含 Session 标题及最多 160 字的回复、错误、问题或工具审批原因，不向第三方服务发送。
risk_level: medium
verification:
  level: source_reviewed
  verified_on: 2026-08-22
  independent_review: true
  review_notes: 已审阅固定提交的通知判定、浏览器权限请求、自定义音频、设置存储和 Host schema。插件没有外部网络、文件系统或命令能力，权限只在用户手势后申请；但系统通知会把会话摘要显示到桌面或锁屏，自定义音频会占用站点存储。共享或演示设备应关闭正文预览/系统锁屏通知，敏感会话建议禁用插件。
summary:
  zh: 在 DSH 会话完成、失败、需要回答或等待权限时发送浏览器系统通知，并支持内置提示音或用户导入的本地音频。
  en: Notifications for four session states, with browser alerts and prompts.
