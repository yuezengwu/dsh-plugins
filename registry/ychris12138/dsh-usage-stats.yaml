  data_flow: DSH Token 事件与本机 Provider/订阅凭据 → Host 端聚合器和供应商适配器 → 官方或用户配置的余额/配额端点 → 脱敏账户结果与统计缓存 → 仅回环 GET 路由和 Web 面板。
risk_level: high
verification:
  level: source_reviewed
  verified_on: 2026-08-22
  independent_review: true
  review_notes: 已审阅固定提交的 Host、账户发现、余额、订阅、用量聚合、缓存和 Web 路由。浏览器端不接收 API Key、Cookie、PAT 或原始上游响应，写入缓存也不保存凭据；但部分余额和订阅接口并非公开稳定 API，Cookie 等同登录凭据，声明式或自定义 Base URL 还决定凭据发送目标。只启用可信 Provider，避免使用主账号长期 Cookie，并把金额和配额视为参考值。
summary:
  zh: 在 DSH Web 中展示多供应商余额、订阅配额和 Token 用量，提供今日、月度、累计、缓存命中率和日历热图，并支持声明式余额适配器。
  en: Multi-provider usage dashboard with provider/model token breakdowns, calendar drill-downs, account balances, and OpenCode Go / Z.ai subscription quota tracking.
