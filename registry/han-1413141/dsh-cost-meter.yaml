  data_flow: DSH 模型用量事件 → 本机 $DSH_HOME/storages/cost-meter/ledger.json → 成本、预算、热力图与通知；启用余额或套餐查询时，本机凭据 → 对应官方白名单或用户显式配置端点 → 剩余额度返回设置页。
risk_level: high
verification:
  level: source_reviewed
  verified_on: 2026-08-22
  independent_review: true
  review_notes: 已审阅固定提交的主入口、价格表、账本、网络重试、Coding Plan、自定义余额和安全说明。账本与配置保存在本机，官方查询限制到预设端点；自定义余额则会把用户选择的凭据占位符发送到自定义 URL。价格、峰谷规则和非公开套餐接口都可能变化，显示金额只能作为估算，配置自定义端点前必须确认域名归属。
summary:
  zh: 在 DSH 中统计会话与每日 Token 成本、预算和历史，并查询官方余额、自定义 Provider 余额及多家 Coding Plan 订阅额度。
  en: Per-session and daily API cost, budget with usage %, official balance, history dashboard, and one-click official price sync with peak/off-peak pricing.
