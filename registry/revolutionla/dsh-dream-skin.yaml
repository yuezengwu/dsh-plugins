dsh:
  kind: plugin
  compatibility_status: declared
  compatibility_notes: 插件版本 0.4.10，要求 Node.js >=18，peer 依赖基于 DSH 0.1.0-rc.6 Web 主题组件；本站完成固定提交静态审阅，未在不同浏览器、超大图片或第三方壁纸 URL 上运行
category: interface
topics:
  - theme
