permissions:
  status: reviewed
  capabilities:
    - filesystem_read
    - filesystem_write
    - network_access
    - credentials
    - browser_control
    - remote_control
    - ui_injection
  notes: 在浏览器注册主题并读写 localStorage，处理用户导入的主题 JSON、本地图片和远程壁纸 URL；不读取模型凭据、不修改 DSH 安装包，也不注册 Agent 工具
  data_flow: 内置 Token、本地主题文件或 URL hash → 客户端格式/颜色校验 → Theme Runtime 与 localStorage → DSH Web 外观；远程壁纸 URL 会由用户浏览器直接请求对应图片主机。
risk_level: medium
verification:
  level: source_reviewed
  verified_on: 2026-08-22
  independent_review: true
  review_notes: 已审阅固定提交的 Host 状态、客户端主题注册、导入校验、壁纸和回滚路径。主题包是受约束 JSON，不执行脚本，内置主题与本地图像保持本机；但分享链接可携带第三方主题数据，远程壁纸会暴露浏览器网络元数据并受外部内容稳定性影响。只导入可信主题包，优先使用本地图像或 HTTPS 可信图床，避免在主题链接中携带隐私信息。
summary:
  zh: 基于 DSH 官方 Theme Token 提供八套原生主题、自定义壁纸、模糊与透明度、强调色、主题包导入导出、本地收藏和分享链接。
  en: "One-command skin plugin: 8 original themes, translucent wallpaper with opacity/blur, per-user accent, and shareable theme-pack import/export, favorites and surprise-me — purely native on DSH's token system."
