dsh:
  kind: plugin
  compatibility_status: declared
  compatibility_notes: 插件版本 0.8.0、private GitHub 包，明确使用 DSH 0.1.0-rc.8 系列 client/settings/tools peer，要求 Node.js >=22 和 Chrome/Chromium/Brave/Edge；本站完成固定提交静态审阅，未在当前 0.1.1-rc.2 基线、登录网站、root/Docker、三平台录屏或验证码场景运行
category: browser
topics:
  - browser
permissions:
  status: reviewed
  capabilities:
    - filesystem_read
    - command_execution
    - network_access
    - credentials
    - browser_control
  notes: 启动内置 ego runtime、Chromium、CDP 和可选 FFmpeg 子进程，读取和操作登录网页、执行页面 JS/原始 CDP/任意 ego 脚本、上传下载文件、持久化登录态并把实时画面与鼠标键盘输入桥接到 DSH Web
  data_flow: Agent 的 ego_* 参数或用户在观察窗的鼠标键盘 → ctx.subprocess、ego runtime 与共享 Chromium/CDP → 目标网站、Cookie、页面内容、文件和网络响应 → 结构化结果/截图/下载返回 Agent，JPEG SSE 或 H.264 流返回本机观察窗；可选 FFmpeg 从固定 HTTPS 资产下载并校验 SHA-256 后写入 ~/.dsh/cache。
risk_level: high
verification:
  level: source_reviewed
  verified_on: 2026-08-22
  independent_review: true
  review_notes: 已审阅固定提交的工具层、同源 JSON 设置路由、观察 Worker、FFmpeg 下载校验和公开说明。配置路由要求 POST、application/json，并在存在 Origin 时校验与 Host 同源；FFmpeg 下载限制公网 HTTPS、大小、重定向和固定哈希，tar 条目也做越界检查。但插件可接管已登录浏览器、执行任意页面脚本、保存 Cookie、上传下载并在 macOS/X11 读取画面，root 模式还会使用 --no-sandbox。使用独立低权限浏览器 Profile，不登录主账号，不处理支付/后台管理页面，默认 CDP，慎开录屏权限与登录持久化。
summary:
  zh: 把 ego-lite 的真实 Chromium 接入 DSH，提供 32 个导航、读取、交互、脚本、下载、上传和登录态工具，并通过 CDP 或 FFmpeg 实时观察和人工接管 Agent 浏览器。
