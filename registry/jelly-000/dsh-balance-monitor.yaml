  compatibility_status: declared
  compatibility_notes: 插件版本 0.1.2、MIT，未声明 Node.js 或 DSH peer 版本；本站完成固定提交静态审阅，未在当前 0.1.1-rc.2、真实 DeepSeek 账户、多币种、跨日重置或上游故障下运行
category: management
