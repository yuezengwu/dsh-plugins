  review_notes: 对比旧固定提交后复核了运行时主题、动态权限预设、插件 API、全屏草稿编辑、会话恢复和设置能力。TUI 不自建沙箱而继承 Profile；Windows 默认权限尤其需要先收紧，剪贴板、外部编辑器、Provider 向导、更新和调试渲染日志还可能接触本机程序、凭据或会话内容。
