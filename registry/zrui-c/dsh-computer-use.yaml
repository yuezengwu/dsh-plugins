  compatibility_status: declared
  compatibility_notes: 插件版本 0.3.0、Apache-2.0，要求 Node.js >=22、DSH 主要 peer 从 0.1.0-rc.6 起，仅支持 macOS；本站完成固定提交静态审阅，未安装签名 Helper、授予 Accessibility/Screen Recording、运行 Swift 测试或在当前 0.1.1-rc.2 实机操作
category: browser
topics:
  - tools
