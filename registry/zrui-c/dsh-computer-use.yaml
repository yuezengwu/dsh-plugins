permissions:
  status: reviewed
  capabilities:
    - network_access
    - credentials
    - browser_control
    - session_data
    - ui_injection
  notes: 注册全局 computer_observe/computer_action 工具，可控制独立 Chromium 上下文或 macOS 应用；桌面能力需要用户授予 Accessibility，截图/OCR 需要 Screen Recording，浏览器上传只允许当前 Session Workspace 内文件
  data_flow: Agent 动作参数与最新 snapshot_id → Playwright 浏览器上下文或 0600 Unix socket 本机 Helper → 页面 DOM/Accessibility、桌面 Accessibility tree、可选 OCR/截图与输入事件 → 有界文本观察返回 Session；浏览器 cookies/storage state 和截图保存在本机 stateDir。
risk_level: high
verification:
  level: source_reviewed
  verified_on: 2026-08-22
  independent_review: true
  review_notes: 已审阅固定提交的安全说明、工具 schema、Workspace 上传围栏、Session 隔离浏览器、Unix socket、原生 Helper 权限和新鲜快照约束。Socket 位于 0700 目录并设为 0600，文件上传用 resolve/relative 阻止越界，UI 文本明确标为不可信；但工具继承到所有 Agent Preset，Accessibility/Screen Recording 能接触大量敏感界面，浏览器 storage-state 含 cookies，私有 SkyLight API 也有兼容风险。只安装可验证签名与校验和的发行物，保持人工审批，使用专用浏览器上下文，并把 stateDir 当敏感数据保护。
summary:
  zh: 为 macOS 上的 DSH Agent 提供文本优先的 Chromium 与桌面观察和操作，结合 Playwright、Accessibility、OCR、窗口定向输入和新鲜快照引用执行单步动作。
  en: "Text-first computer use for DSH: background Chromium control via Playwright/CDP plus accessibility-first macOS control; actions stay pinned to the right process and window without taking the user's pointer, ships a Developer ID signed, notarized Universal 2 DMG."
