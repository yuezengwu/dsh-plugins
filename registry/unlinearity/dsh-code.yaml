  data_flow: 终端输入、文件/图片引用和凭据设置 → DSH Agent、Session、模型 Provider、权限与工具管线 → 工作区文件、Shell、网络、Git、子 Agent 或外部模型 → 流式结果、工具卡和持久事件返回 TUI；界面临时状态留在 React，持久事实进入 DSH Session/Settings/Credentials。
risk_level: high
verification:
  level: source_reviewed
  verified_on: 2026-08-22
  independent_review: true
  review_notes: 已审阅固定提交的清单、组合层、授权、Provider 设置、Session 切换、附件、Git、子 Agent 和终端面板。它不是另造一套 Agent 内核，工具调用、审批、权限与 sandbox 复用 DSH 服务，且依赖精确对齐当前 rc.2；但作为完整编码客户端会接触模型密钥、工作区、Shell、Session 和所有已装插件，选择 danger-full-access 或不可信 Provider 时风险与主 DSH 一致。保持最小权限 preset，核对 /model endpoint 与凭据来源，升级 DSH 时同步升级该包。
summary:
  zh: 为 DeepSeek Harness 提供完整终端编码界面，复用官方 Agent、Session、模型、凭据、工具、Skills、权限、Sandbox、子 Agent、计划、Goal 和持久化服务。
