  verified_on: 2026-08-22
  independent_review: true
  review_notes: 已审阅固定提交的 Provider、认证刷新、本机登录路由、凭据引用和安装 CLI。Web 写操作要求 loopback 且校验本机同源，认证 endpoint 固定，凭据不进入普通模型目录；但提示词、工具 schema 和账号令牌会交给第三方云服务，CLI 会备份并改写 settings/.credentials，且依赖停留在 rc.6。使用独立账号和限额 Key，确认服务条款与数据政策，备份文件按密钥处理，升级前先在临时 Profile 验证。
summary:
  zh: 把 WorkBuddy API Key 或 CodeBuddy 中国站网页登录令牌接入 DSH，提供模型目录同步、自定义容量与 reasoning effort，并通过 OpenAI 兼容接口调用模型。
