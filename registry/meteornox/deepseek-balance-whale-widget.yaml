  data_flow: 本机 DSH 凭据 → 插件 Host → api.deepseek.com 余额接口和可选 platform.deepseek.com 用量接口 → 金额、Token 与峰谷估算 → 本机 /dsh-whale/*.json 路由和 Web 挂件；本地账本最多保留约 30 天日用量。
risk_level: high
verification:
  level: source_reviewed
  verified_on: 2026-08-22
  independent_review: true
  review_notes: "已审阅固定提交的完整打包入口、凭据解析、余额/用量请求、账本和 Web 路由。代码不把令牌返回浏览器，但 balance.json 与设置路由未做同源或身份校验，并返回 Access-Control-Allow-Origin: *；不要把 DSH Web 直接暴露到不可信网络。平台令牌来自网页会话而非普通 API Key，权限和失效机制需由用户自行承担，DeepSeek 调价后内置估算也可能过时。"
summary:
  zh: 在 DSH Web 右下角显示可拖拽的鲸鱼余额挂件，读取 DeepSeek API 余额，并可用平台令牌按小时 Token 分桶估算当日用量。
