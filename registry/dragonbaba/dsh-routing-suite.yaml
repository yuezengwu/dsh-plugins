    - ui_injection
    - agent_orchestration
  notes: 仅在用户选择 routing-suite Preset 后读取 Session 第一条用户消息、用本地正则分类，并向 system prompt 增加一段行为建议；随包 Preset 复制 DSH Standard 的文件、Shell、Web、Skill、子 Agent 与工作流工具面，实际权限仍由宿主审批和沙箱控制
  data_flow: 首个用户任务文本 → 本地关键词评分 → inspect-first/direct/neutral → 一段固定英文 guidance 进入当前 Agent 系统提示；不向外部服务发送额外请求，也不额外读写业务文件或保存分类结果。
risk_level: medium
verification:
  level: source_reviewed
  verified_on: 2026-08-22
  independent_review: true
  review_notes: 已审阅固定提交的意图提取、分类顺序、提示注入、配置与 Preset 来源。路由逻辑短小、无网络/文件/子进程副作用，且只影响显式选择的 Preset；但规则匹配可能误判，随包 Standard Preset 含完整开发工具与多 Agent 能力，不能把提示路由当作权限隔离。使用前核对当前 DSH Standard 差异，保持宿主审批/沙箱，并在维护任务中人工确认先审计后修改。
summary:
  zh: 提供一个可选 DSH Agent Preset，根据首个真实用户任务把工作模式分为先检查再修改或直接实现，并把简短路由建议注入系统提示。
