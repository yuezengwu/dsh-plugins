  compatibility_notes: 插件版本 0.1.0、MIT，要求 Node.js >=20，未声明 DSH peer 版本；本站完成固定提交静态审阅，未在当前 0.1.1-rc.2、真实 Tailnet ACL、Serve 版本、WebSocket、反向代理或移动端远程会话下运行
category: remote
