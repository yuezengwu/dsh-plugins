permissions:
  status: reviewed
  capabilities:
    - filesystem_write
    - credentials
    - session_data
    - agent_orchestration
  notes: 在工作区 .dsh-meow 下读写 SQLite、会话已见记录和 dream 调试日志；可改写用户消息前缀、注册 memory_* 写工具，并通过原 Session Agent steer 自动触发新的模型回合整理记忆
  data_flow: 用户对话、Agent 写入和工作区标识 → 本地 .dsh-meow/memory.db 与会话召回索引 → 首轮长期记忆/后续 top-2 命中注入所选模型上下文 → memory_* 工具更新本地库；夜间 dream 把本窗口相关记忆与整理指令交给原 Agent/模型，再将结果写回数据库。
risk_level: high
verification:
  level: source_reviewed
  verified_on: 2026-08-22
  independent_review: true
  review_notes: 已审阅固定提交的数据库、工具、注入、检索、dream 租约和子 Agent 边界。记忆按工作区本地保存，子 Agent 不直接注入，dream 复用原会话 Agent 而非额外隐藏 Provider；但用户偏好、项目事实和历史记忆会随正常模型调用发送给当前 Provider，自动提取也可能固化错误、敏感信息或提示注入。仅用于可信工作区，避免记录密钥和个人敏感数据，检查 memory_search/dream 结果并定期归档错误条目。
summary:
  zh: 为每个工作区建立七层 SQLite 长期记忆，向首轮和后续用户消息注入相关条目，并提供记忆写入、检索、项目全景、更新、查重及夜间 dream 整理工具。
  en: 'Project-scoped cross-session memory: six-layer SQLite store (soul/user/project/fact/lesson/topic) on node:sqlite, cache-friendly first-message injection, memory_remember/search/find_similar/read/update tools, and per-window nightly consolidation ("dream").'
