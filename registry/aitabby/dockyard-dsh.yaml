  compatibility_notes: 插件版本 0.1.1，要求 Node.js 22.19 或 24+，作者说明按 DSH 0.1.0-rc.6 验证；本站完成固定提交静态审阅，未进行真实 OAuth、Keychain、CLI fallback、DMG 或 Provider 请求测试
