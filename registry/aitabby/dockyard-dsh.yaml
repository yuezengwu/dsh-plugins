permissions:
  status: reviewed
  capabilities:
    - network_access
    - credentials
    - browser_control
    - session_data
    - ui_injection
  notes: 打开官方 OAuth 页面和回环回调，扫描本机官方 CLI/桌面会话，保存 refresh token 到 macOS Keychain，调用 Provider 原生 API，并在 macOS App 中启动内置 DSH 进程
  data_flow: 官方浏览器 OAuth 或本机已登录 CLI/客户端 → PKCE/state 校验与安全凭据引用 → Dockyard 账号池和选择策略 → Codex/Claude/Grok/Cursor/Antigravity 原生模型端点 → 流式结果、模型目录与额度返回 DSH。
risk_level: high
verification:
  level: source_reviewed
  verified_on: 2026-08-22
  independent_review: true
  review_notes: 已审阅固定提交的 DSH Bridge、账号池、Provider 模块、OAuth 说明、Keychain Helper 和 macOS App。原始 Token 不进入页面状态或账号池快照，macOS 使用 Keychain，非 macOS 安全存储缺失时失败关闭；但它同时跨越多个账号、OAuth 协议、本机客户端文件和模型请求，Provider 非公开字段与范围可能变化，DMG 还是 ad-hoc 签名预览。逐个启用账号并核对授权范围，优先固定提交安装，不在生产环境使用未经独立验证的 App 构件。
summary:
  zh: 把 Codex、Claude、Grok、Cursor 和 Antigravity 的官方 OAuth 或本机客户端登录态接入 DSH，统一管理多账号、模型、额度、轮换、故障转移和原生请求。
