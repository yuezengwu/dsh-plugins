dsh:
  kind: plugin
  compatibility_status: review
  compatibility_notes: 插件版本 0.16.0、AGPL-3.0，明确面向 DSH 0.1.0-rc.8，依赖 dsh-sdk-client/settings rc.8，要求 Node.js >=22.19；本站完成固定提交静态审阅，未在当前 0.1.1-rc.2 基线、真实飞书租户、多实例守护、ACP 或服务安装上运行
category: remote
topics:
  - notify
  - remote
permissions:
  status: reviewed
  capabilities:
    - credentials
    - remote_control
    - session_data
  notes: 持有飞书 App 凭据并远程创建或恢复 DSH Agent，可读写文件、联网、启动进程和调用工具；通过管理员、allowlist、mention、逐工具审批、计划门禁、workspace containment 和 Session scope 限制远程能力
  data_flow: 飞书消息、附件、卡片选择与操作者 open_id → freshness/allowlist/mention/scope 校验和持久任务队列 → 隔离的 DSH Session、模型 Provider、工具与工作区 → 卡片、文件和状态返回原聊天；配置、凭据引用、Session 路由和任务状态以 0600 文件保存在本机。
risk_level: high
verification:
  level: source_reviewed
  verified_on: 2026-08-22
  independent_review: true
  review_notes: 已审阅固定提交的 SECURITY、访问控制、路径/SSRF 防护、审批、计划门禁、本机回调和服务守护。回调只绑定 127.0.0.1 并使用每次启动随机 Token，文件回传做 realpath/no-follow/大小限制，管理员写操作和 member scope 失败关闭；但无白名单时私聊默认仍为兼容首次绑定而开放，群消息/审批卡可能暴露任务与参数，远程 Agent 最终权限仍取决于所选 Profile。首次绑定后立即设置管理员和 allowlist，保持 @ 触发，使用专用 workspace 与最小权限 preset，敏感任务改用私聊。
summary:
  zh: 把 DSH 编码 Agent 接入飞书/Lark，支持按聊天、话题或成员隔离 Session、模型与工具审批卡、计划门禁、文件回传、多机器人协作、服务守护和故障救援。
  en: "Feishu/Lark bridge for DeepSeek Harness: scan-to-connect PersonalAgent binding, streaming cards, git-worktree project workspaces, parallel per-scope tasks, multi-role agents, cross-session notify, in-chat model/key management, and a safety-net guardian that still answers in Feishu after dsh crashes."
