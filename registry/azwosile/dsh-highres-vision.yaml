dsh:
  kind: plugin
  compatibility_status: declared
  compatibility_notes: 插件版本 0.2.0、MIT、Node.js >=18，未声明 DSH peer；作者明确面向 deepseek-v4-flash-vision-exp。本站按当前跟踪的 DSH 0.1.1-rc.2 完成固定提交静态审阅，未安装插件，也未实测超大图片、模型调用、跨平台路径、内存、Token 或费用。
category: vision
topics:
  - vision
permissions:
  status: reviewed
  capabilities:
    - filesystem_read
    - filesystem_write
    - credentials
    - session_data
    - plugin_management
  notes: 模型工具可读取当前 Session 附件，也接受任意绝对本机图片路径；会在 Session 工作区建立临时目录、复制原图、用 Jimp 生成切片，再递归删除临时目录。Patch 把单图、像素、每消息图片数和请求体限制显著提高，默认 maxTiles=0 不限制切片数量。
  data_flow: 用户选择的 Session 附件或本机图片路径 → 工作区 .dsh-highres-vision 临时副本与 Jimp 切片 → DSH read_image → 已配置的 DeepSeek 视觉模型 → 图像理解结果返回会话；临时切片目录随后删除，原附件和原文件不删除。
risk_level: high
verification:
  level: source_reviewed
  verified_on: 2026-08-26
  independent_review: true
  review_notes: 已审阅固定提交的 Bundle、图片入口、路径解析、Jimp 分块、read_image 调用、限制修改和临时目录清理。插件自身不读取模型凭据、不直接连接第三方服务，但 DSH 会把图片送往已配置的视觉模型；任意绝对路径读取扩大了数据边界，放宽限制和无界切片也可能造成内存、磁盘、Token 与费用压力。只在非敏感图片、可信工作区和指定视觉模型中使用，优先传 Session 附件或工作区路径，显式设置 maxTiles，并在安装前记录 Patch 的回滚方式。
summary:
  zh: 为 deepseek-v4-flash-vision-exp 放宽 DSH 图片限制，并提供 highres_read 工具，把高清图片按网格切片后交给视觉模型读取。
