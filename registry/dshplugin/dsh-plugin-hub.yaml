  data_flow: 远端社区目录和用户确认 → 本机同源 POST、目标语法与包入口预检 → 串行 dsh plugin 子进程和 Profile/pnpm-workspace 写入 → 安装日志、状态和待重启记录返回页面；安装的第三方代码在重启后进入 DSH Host。
risk_level: high
verification:
  level: source_reviewed
  verified_on: 2026-08-22
  independent_review: true
  review_notes: 已审阅固定提交的同源门禁、目标语法、安装前 tarball 检查、任务队列、参数数组调用、Profile 写入与重启脚本。写操作只接受 Origin 与 Host 一致且 hostname 为 localhost/127.0.0.1/::1，请求体有 4KB 上限，命令目标不经 shell 拼接；但市场仍可安装未经本站源码审核的任意 npm/GitHub 包，并可能自动放行其 prepare 构建，属于高风险供应链入口。只在 loopback DSH 使用，逐项阅读固定提交源码，先备份 Profile，不要把目录收录等同安全认证。
summary:
