dsh:
  kind: plugin
  compatibility_status: declared
  compatibility_notes: 插件版本 0.1.0、MIT，要求 Node.js ^22.19 或 24+，DSH peer 从 0.1.0-rc.6 起；当前仅支持 macOS。本站完成固定提交静态审阅，未授予真实 Accessibility/Screen Recording 权限，也未在当前 0.1.1-rc.2、敏感应用或多显示器环境运行
category: tools
topics:
  - tools
permissions:
  status: reviewed
  capabilities:
    - credentials
    - session_data
    - ui_injection
  notes: 需要 macOS Accessibility 权限来读取和操作其他应用 UI，仅在请求截图时需要 Screen Recording；向 Agent 注册观察、点击、输入、按键、滚动、拖拽和一次性确认工具，正常设计不要求 danger-full-access
  data_flow: Agent Tool 参数与应用 grant → DSH approval、Session lease 和宿主交互策略 → 原生 macOS helper 读取目标进程 Accessibility tree 或投递定向输入 → 有界观察、截图 Artifact 与动作后新状态返回 Session；安全输入值脱敏，交互决定存入插件自有 Session sidecar。
risk_level: high
verification:
  level: source_reviewed
  verified_on: 2026-08-22
  independent_review: true
  review_notes: 已审阅固定提交的中英文说明、安全策略、同源设置路由、授权 lease、敏感确认、Artifact 路径围栏、目标重绑定和原生 helper 边界。设置写入要求同源 POST 与 application/json，动作绑定精确 bundle id、pid、窗口和新鲜 observation，高影响操作还需短时一次性 token；但 Accessibility/Screen Recording 本身可见大量敏感界面，同一 macOS 用户下的恶意代码仍可能绕过插件 Tool 路径直接调用原生能力。只授权必要应用，保持 workspace-write 与 approval=ask，截图按敏感数据处理，银行、密码和隐私设置等场景必须人工在场。
summary:
  zh: 为 macOS 上的 DSH Agent 提供基于 Accessibility 的界面观察与定向操作，优先使用语义化元素动作，并支持应用范围授权、过期状态拒绝、截图 Artifact 和敏感动作二次确认。
  en: "Accessibility-first macOS computer use: fresh observations, stale-state rejection, scoped permissions, and safe input."
