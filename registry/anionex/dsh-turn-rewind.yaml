  independent_review: true
  review_notes: 对比旧固定提交后复核了 Git-native 检查点、只回溯消息、设置卡、检查点管理、跨工作区清理和恢复失败回滚。实现包含路径、symlink、活动 Agent、stale plan 和 Git 状态检查，但恢复本质上会覆盖或删除文件；重要工作区仍需先提交或外部备份，并逐项核对预览。
summary:
