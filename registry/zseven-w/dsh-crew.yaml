  data_flow: Claude Code/Codex 任务 → 本机 MCP dsh_run_worker → 可达 DSH Hub 或独立 DSH Runtime → Agent 模型、工具与工作目录 → 进度、工具调用、Token 和结果返回宿主任務面板；视觉请求可转交本机 CLI 或自定义 API。
risk_level: high
verification:
  level: source_reviewed
  verified_on: 2026-08-22
  independent_review: true
  review_notes: 已审阅固定提交的 MCP Server、Hub 路由、任务、视觉/多模态、状态分片和安装器。Hub 模式复用 DSH 凭据，独立模式从 ~/.config/dsh-crew/.env 读取 DeepSeek Key；安装器会修改 Claude/Codex 配置并在写入前备份。该插件跨越多个 Agent、进程、凭据和配置边界，自定义命令模板还可启动本机程序。只启用必要宿主和 Provider，核对备份与绝对路径，并把派发 Agent 的工具权限限制在任务所需范围。
summary:
  zh: 把 DSH Agent 作为 Claude Code 或 Codex 的原生子 Agent 调用，提供实时进度、档位与失败升档、会话接入、图片理解/生成、自定义 Provider 和独立运行回退。
  en: "Dispatch work to DSH agents from Claude Code or Codex: native subagent progress, in-host worker sessions with per-tier presets, and a multimodal bridge for vision and image generation."
