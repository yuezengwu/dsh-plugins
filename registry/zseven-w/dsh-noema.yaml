    - session_data
    - ui_injection
  notes: 启动随平台 npm 包分发或用户自定义的 noema-mcp 可执行文件，默认读写 ~/.agent-memory；可扫描 Codex、Claude Code、Cursor、Grok、WorkBuddy、Trae、Qoder 等用户目录和工作区规则并导入长期记忆
  data_flow: DSH 记忆工具与系统提示词 → stdio MCP 客户端 → 本机 noema-mcp 子进程 → NOEMA_ROOT 下 Markdown/PageIndex 记忆 → 召回结果返回模型；启用导入时，其他 Agent 的记忆/规则文件 → 分段去重 → Noema 长期存储。
risk_level: high
verification:
  level: source_reviewed
  verified_on: 2026-08-22
  independent_review: true
  review_notes: 已审阅固定提交的 Bundle 入口、平台二进制解析、stdio MCP、保活、工具、设置、导入器和状态路由。默认二进制来自版本锁定的可选 npm 包而非运行时下载，MCP 消息和调用有大小/超时限制；但它仍以桌面用户权限运行，导入功能会读取多个主目录中的长期记忆，hard forget 可永久删除记录，自定义 Server command 还可启动任意程序。首次使用前应备份 NOEMA_ROOT，只启用需要的导入源，并核对可执行文件来源。
summary:
  zh: 把本地优先的 Noema MCP 记忆服务接入 DSH，提供召回、全文搜索、图遍历、写入、审核、删除和从十类编码 Agent 导入记忆。
  en: Long-term memory for DSH agents — durable, inspectable memories with recall, search, browse and knowledge-graph tools, import from ten other AI coding tools, and a settings page.
