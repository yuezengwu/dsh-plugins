  notes: 保存独立 OpenAI OAuth Token 并调用 Codex 模型、用量、搜索和图片端点，注册 view_image 与 image generation 工具，可按 DSH 文件权限写出生成图片并维护受信浏览器 Origin
  data_flow: 浏览器 OAuth 与 PKCE 状态 → 默认仅 loopback/显式受信 Origin 的 Host 路由 → owner-only 本机认证文件 → OpenAI Codex、用量、搜索或图片端点 → DSH LLM 流、工具卡片与文件；Token 刷新使用锁和原子写入回本机。
risk_level: high
verification:
  level: source_reviewed
  verified_on: 2026-08-22
  independent_review: true
  review_notes: 已审阅固定提交的安全说明、OAuth、认证路由、凭据文件、Origin 信任、模型适配、搜索、图片和历史迁移。插件不会复制或修改 ~/.codex/auth.json，认证文件默认放在独立 DSH Home 并采用 owner-only 权限，诊断输出不含 Token；但它是 Alpha 且精确依赖 rc.7，ChatGPT 订阅接口不是公开 Platform API，兼容性和账号政策可能变化，卸载包也不会自动删除 OAuth 状态。只在匹配的测试 Profile 使用，固定提交安装，限制受信 Origin，需要撤销时先执行 logout 再卸载。
summary:
  zh: 通过独立 ChatGPT OAuth 为 DSH 提供 OpenAI Codex 模型目录、Fast Mode、额度信息、搜索、图片读取和 GPT Image 生成，同时保留 DSH 原生工具、审批与会话恢复。
  en: Connect ChatGPT OAuth and OpenAI Codex models to DeepSeek Harness, with opt-in search and image tools.
