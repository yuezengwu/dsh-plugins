dsh:
  kind: plugin
  compatibility_status: declared
  compatibility_notes: 插件版本 0.2.5，peer 依赖基于 DSH ^0.1.0-rc.7；本站完成固定提交静态审阅，未进行真实 ChatGPT OAuth、额度、图片生成、搜索、Token 刷新或不同订阅计划兼容测试
category: infrastructure
topics:
  - infrastructure
permissions:
  status: reviewed
  capabilities:
    - filesystem_write
    - command_execution
    - network_access
    - credentials
    - browser_control
    - ui_injection
  notes: 发起 Codex OAuth 并在 DSH Home 保存访问/刷新凭据，调用 ChatGPT/Codex 的模型、用量、搜索和图片端点；还可写入辅助二进制、注册 Host 路由并启动子进程提供 CLI/TUI
  data_flow: 用户浏览器 OAuth → loopback/受信 Origin 校验与本机凭据文件 → Codex 模型、用量、搜索或图片端点 → DSH LLM、工具与界面；生成图片按 DSH 文件权限写入目标路径，刷新后的 OAuth 状态原子写回本机。
risk_level: high
verification:
  level: source_reviewed
  verified_on: 2026-08-22
  independent_review: true
  review_notes: 已审阅固定提交的 OAuth 状态、路由信任、凭据锁与权限、Responses 适配、搜索、图片、二进制安装和诊断代码。凭据文件采用 owner-only 与原子写入，浏览器登录路由默认受 loopback/受信 Origin 限制，文件写入仍经过 DSH fs；但 ChatGPT 订阅并非 OpenAI API 凭据，相关私有兼容端点可能变化，OAuth Token 和图片/搜索内容会进入 OpenAI 服务，安装辅助二进制也扩大供应链面。使用专用账户、固定版本与最小权限 Profile，核对订阅条款，升级前先退出并备份独立凭据。
summary:
  zh: 通过 OpenAI Codex 登录流程把 ChatGPT 订阅模型接入 DSH，并提供模型适配、额度状态、Web 搜索、图片读取与生成、Fast Mode、诊断和 TUI 启动能力。
