  notes: 复用 DSH 会话、Agent、工具、审批、凭据和子 Agent 服务；可读取工作区内 @ 引用文件、系统剪贴板，启动外部编辑器与语言服务器，并在 npm 安装来源下自动更新和重启宿主
  data_flow: 终端输入、附件、工作区文件摘要与剪贴板 → Tianshu TUI 适配层 → DSH 会话、模型、工具、审批和可选视觉模型 → 流式结果与状态渲染回终端；主题和输入偏好写入 ~/.dsh-tui。
risk_level: high
verification:
  level: source_reviewed
  verified_on: 2026-08-22
  independent_review: true
  review_notes: 已审阅固定提交的入口、会话适配、工作区引用、外部编辑器、剪贴板、LSP、自更新和重启实现。文件引用限制在 cwd 且摘要截断，但外部编辑器、剪贴板工具和 LSP 都会启动本机程序；TypeScript LSP 默认可通过 npx -y 获取。npm 安装版本还会在启动时查询 npm/npmmirror、执行包管理器升级并重启 DSH，可用 DSH_TUI_SKIP_UPDATE=1 关闭。
summary:
  zh: 为 DSH 提供交互式终端界面，支持流式 Markdown、工具与审批卡片、多会话标签、主题、Slash 命令、LSP 诊断、成本统计和可选视觉问答。
  en: A terminal UI (TUI) for DeepSeek Harness.
