  independent_review: true
  review_notes: 已审阅固定提交的余额服务、用量采集、价格、Session Projection 和三个 HTTP 路由。API Key 不返回浏览器且只发往 DeepSeek 官方固定地址，但余额、用量和扣费路由没有独立身份或同源检查，任何能够访问 DSH Web 的客户端都可能读取这些账户与会话统计；价格表也会随官方调整而过时。不要把 DSH Web 暴露到不可信网络，并把金额显示视为估算。
summary:
