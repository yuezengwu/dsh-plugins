permissions:
  status: reviewed
  capabilities:
    - credentials
    - session_data
    - agent_orchestration
  notes: 调用 DSH subagent、模型、Session、工具、任务和存储服务；成员会继承各自允许的工具与工作区能力，Git 源安装还可能执行仓库 prepare 构建
  data_flow: 用户请求与已保存小队定义 → 主模型生成有界 DAG → DSH 子 Agent 按成员模型、工具和依赖执行 → 结果、错误、审核轮次和 Token 用量写入运行历史 → 主 Agent 汇总返回会话。
risk_level: high
verification:
  level: source_reviewed
  verified_on: 2026-08-22
  independent_review: true
  review_notes: 已审阅固定提交的 Bundle 入口、小队派发、编排、RPC、定义事务和运行中心。实现会禁止被委派成员再次调用小队/subagent 工具，并设置并发、重试、质量轮次和软 Token 上限；但成员仍会处理用户内容并使用被授权工具，持久配方和运行历史也会落在本机。建议只给每个成员最小工具集，固定安装版本，并在启用 Git prepare 前审阅构建脚本。
summary:
  zh: 为 DSH 提供可持久复用的多模型 Agent 小队，让主 Agent 按有界依赖图拆分任务，并为每个成员配置模型、角色、工具策略、Token 上限、重试和审核门禁。
  en: Persistent multi-model squads configured in Settings and selected in the Composer, with per-member model/tool policies; the main Agent dynamically plans each send as a bounded DAG with bounded reviewer/repair loops, while Run Center tracks retries and per-member tokens from official Harness usage events.
