  compatibility_notes: 插件版本 1.0.0，要求 Node.js 22.19 或 24+，peer 依赖覆盖 DSH 0.1.0-rc.5 至 0.2.0 之前版本；本站完成固定提交静态审阅，未运行真实多模型小队或长期后台任务
category: agent
