dsh:
  kind: plugin
  compatibility_status: declared
  compatibility_notes: 插件版本 0.5.2、BSD-3-Clause、package 标记 private，要求 Node.js >=22.19，DSH tools peer 为 ^0.1.0-rc.6；本站完成固定提交静态审阅，未在当前 0.1.1-rc.2、大型单仓、远程 MCP、Windows 路径或真实 Web 圆环面板下运行
category: development
topics:
  - dev
