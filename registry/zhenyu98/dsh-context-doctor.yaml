permissions:
  status: reviewed
  capabilities:
    - filesystem_read
    - command_execution
    - network_access
    - credentials
    - remote_control
    - session_data
  notes: 只读调用 DSH fs/skills/tools 服务，沿指定 cwd 向上寻找 Git 根并读取最多 256KB 的 AGENTS.md/CLAUDE.md，枚举 Skills 摘要和工具 Schema；GET 接口允许按 session 或显式 cwd 请求审计结果
  data_flow: 当前 Session 或请求指定 cwd → 只读扫描指令文件元数据、重复段落、技能摘要与工具 Schema → Token 统计、冲突与裁剪建议 → 模型工具或 Web 面板；默认摘要不返回完整指令正文，开发者回执仅包含重复段落短预览。
risk_level: medium
verification:
  level: source_reviewed
  verified_on: 2026-08-22
  independent_review: true
  review_notes: 已审阅固定提交的扫描边界、文件大小上限、重复检测、Schema 汇总、缓存和 HTTP 路由。核心不写文件、不执行命令或联网，正文只用于本机计算；但 Web GET 没有 Origin/Host/remoteAddress/身份校验，显式 cwd 可探测宿主可访问目录的指令文件路径、技能描述和工具清单，package 也尚非公开发行状态。保持 DSH loopback，不经反向代理公开该接口，并只对可信工作区运行。
summary:
  zh: 只读审计 DSH 会话的 AGENTS/CLAUDE 指令链、Skills 目录和工具/MCP Schema，估算上下文 Token 成本并提示重复、冲突与工具面膨胀。
  en: "Context injection audit: token costs of instruction chains / skill catalogs / tool schemas, duplicate and conflict detection."
