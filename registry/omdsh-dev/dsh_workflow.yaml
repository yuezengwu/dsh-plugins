  compatibility_notes: 插件版本 0.1.2，要求 Node.js 22.19 或 24+，peer 依赖声明早期 DSH 0.0.1-rc.2 组件并另带 compatibility.json；本站完成固定提交静态审阅，未在当前 DSH 0.1.1-rc.2 上运行兼容性和多 Agent 压力测试
