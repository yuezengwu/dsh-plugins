  compatibility_notes: 插件版本 0.1.0，声明支持 DSH 0.1.0-rc.6 至 0.2.0-0 之前版本并以 rc.7 开发测试，要求 Node.js >=22.19；本站完成固定提交静态审阅，未在当前 0.1.1-rc.2 基线上运行真实三回合删除、压缩冲突或桌面壳测试
