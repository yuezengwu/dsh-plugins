permissions:
  status: reviewed
  capabilities:
    - network_access
    - browser_control
    - session_data
    - ui_injection
  notes: 读取活动 Session 事件和当前 surface，取得 Agent maintenance lease，并向同一 Session 追加 replacement tombstone、flush 到持久存储；浏览器按钮通过本机 Host HTTP 路由提交 Session 与 Assistant Message ID
  data_flow: 用户确认的已完成回合 → POST /dsh-turn-delete → 活动 Agent maintenance lease 与完整闭合回合/surface 校验 → 零内容 replacement 追加并 flush → 后续模型上下文不再包含该回合，原始事件仍留作审计。
risk_level: medium
verification:
  level: source_reviewed
  verified_on: 2026-08-22
  independent_review: true
  review_notes: 已审阅固定提交的 Host 路由、闭合回合定位、压缩节点防护、maintenance lease、replacement 和客户端入口。删除是幂等的，运行中、已混入压缩节点或非连续 surface 的回合会拒绝；但它会真实改变后续模型上下文，且路由没有显式 Origin/Host 校验，主要依赖 DSH loopback 与 application/json 浏览器边界。只在可信本机使用，删除前确认该回合没有后续推理所需约束，并在 DSH 升级后用一次性 Session 复验。
summary:
  zh: 在 DSH Web 的已完成顶层回合旁提供确认删除按钮，用零内容 replacement 从当前模型可见上下文移除该回合，同时保留原始追加式事件日志、Session 和后续回合。
