  compatibility_status: declared
  compatibility_notes: 插件版本 0.2.0、MIT，README 声明需要 DSH 0.1.0-rc.6 或更高，但 package 未声明 Node/DSH peer 且标记 private；本站完成固定提交静态审阅，未在当前 0.1.1-rc.2、真实 Provider、Claude Code 日志或大规模 Session 数据上运行
category: infrastructure
