permissions:
  status: reviewed
  capabilities:
    - filesystem_read
    - filesystem_write
    - credentials
    - remote_control
    - session_data
  notes: 注册三个模型可调用记忆工具，读写 ~/.dsh/dsh-memoir.json 与各工作区 PROJECT_MEMORY.md，向系统提示注入筛选后的项目记忆；Web 面板可读取全局/项目记忆并对已活动或已收录工作区新增、修改和删除条目
  data_flow: 会话 cwd 与模型/用户整理的工作结论 → 结构化全局 JSON 和工作区 PROJECT_MEMORY.md → 排名、缓存及 Session 快照 → 后续系统提示、memoir_read 或 Web 面板；自动收尾只在顶层 Agent 有工具调用且未记录时注入一次归纳提示。
risk_level: high
verification:
  level: source_reviewed
  verified_on: 2026-08-22
  independent_review: true
  review_notes: 已审阅固定提交的原子写入、锁文件、Store 归一化、模型工具、检索、会话快照、自动收尾和 Web 路由。写路由要求 JSON 且只允许最近活动或 Store 已知工作区，文件用 0600 全局索引与原子替换；但记忆会进入未来模型上下文并可能被提交到 Git，Web 读写路由没有独立身份、Origin、Host 或 remoteAddress 校验，自动收尾还会增加模型调用。只在 loopback DSH 使用，避免写入密钥/个人信息，提交 PROJECT_MEMORY.md 前人工检查，并按需要关闭 autoDistill。
summary:
  zh: 为 DSH 增加项目持久记忆：记录、检索、更新和归档工作结论，将精选 Hot Memory 注入后续会话，并可在有实际工具活动的回合结束时提醒自动沉淀。
