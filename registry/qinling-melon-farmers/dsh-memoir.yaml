  compatibility_status: declared
  compatibility_notes: 插件版本 0.5.2、Apache-2.0，DSH host peer 主要为 0.1.0-rc.6；本站完成固定提交静态审阅，未在当前 0.1.1-rc.2、大型记忆库、多进程竞争、Windows 路径、真实自动压缩或长会话缓存下运行
category: knowledge
topics:
