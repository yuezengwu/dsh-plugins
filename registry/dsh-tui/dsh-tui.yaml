  install_spec: github:dsh-tui/dsh-tui#8bdc85073246
license:
  spdx: MIT
  status: clear
dsh:
  kind: plugin
  compatibility_status: declared
  compatibility_notes: 插件版本 0.1.2、MIT，要求 Node.js ^22.19 或 24+，主要 DSH peer 从 0.1.0-rc.6 起；本站完成固定提交静态审阅，未在当前 0.1.1-rc.2、真实终端、长 Session、模型端点或 Windows 上运行，作者明确说明移植前的测试套件目前不能执行
category: interface
topics:
  - interface
permissions:
  status: reviewed
  capabilities:
    - command_execution
    - session_data
    - ui_injection
    - agent_orchestration
  notes: 终端用户可选择模型、恢复 Session、引用工作区文件并执行当前 Profile 注册的 Shell、文件、Skill、工作流和子 Agent 工具；审批、sandbox 和实际主机权限沿用 DSH 组合配置
  data_flow: 终端输入、文件引用、模型选择与审批答案 → 官方 DSH Agent/Session/命令/工具管线 → 工作区、Shell、外部模型、Skills 或子 Agent → 流式推理、工具卡、Diff、提问和持久 Session 结果返回 TUI；恢复 Session 时会按记录的工作区重新执行 DSH 入口。
risk_level: high
verification:
  level: source_reviewed
  verified_on: 2026-08-22
  independent_review: true
  review_notes: 已审阅固定提交的清单、启动与 Session handoff、Agent 组合、审批/提问界面、命令、文件自动补全和工具卡渲染。实现叠加在官方 base bundle 上，没有另造权限绕过；但它是完整 Agent 前端，能力面等同所选 Profile，恢复 Session 还会 re-exec 当前 DSH 入口，且仓库自己的测试套件尚不可运行。使用最小权限 Profile，首次恢复陌生 Session 前核对 cwd 与模型，升级 DSH 时先在临时工作区验证审批和工具渲染。
summary:
  zh: 为 DeepSeek Harness 提供 Claude Code/Codex 风格的交互式终端界面，复用官方 Agent、Session、工具、Skills、子 Agent、工作流、Sandbox、审批和提问能力。
