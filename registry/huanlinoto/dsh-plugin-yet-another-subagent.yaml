dsh:
  kind: plugin
  compatibility_status: declared
  compatibility_notes: 插件版本 0.1.3、AGPL-3.0，要求 Node.js >=22，peer 依赖仍声明 DSH 0.0.1-rc.1 系列和 Cordis 4.0.0-rc.7；本站完成固定提交静态审阅，未在当前 0.1.1-rc.2、真实多模型、深层委派、热更新或旧 Session 修复下运行
category: agent
topics:
  - agent
permissions:
  status: reviewed
  capabilities:
    - credentials
    - session_data
    - agent_orchestration
  notes: 在全局和每个 Agent 层覆盖同名 subagent 工具，调用 DSH 官方 spawn provider；设置通道以 trusted-host 权限管理 Profile，并提供一个会备份后原地修复旧版 Session 日志的人工操作
  data_flow: 用户保存的 Profile → DSH Settings → 模型选择、Persona、工具过滤和深度约束 → 官方子 Agent Provider 与独立子 Session；进度投影把子 Session 的状态、工具次数和 Token 用量回显到父会话。
risk_level: high
verification:
  level: source_reviewed
  verified_on: 2026-08-22
  independent_review: true
  review_notes: 已审阅固定提交的 Profile 校验/持久化、RPC 权限、Agent 作用域工具覆盖、官方 Subagent/Jobs 调用、进度投影和 Session 日志修复。委派执行仍经 DSH 官方 Provider，工具过滤和最大深度可限制能力；但 none/deny 配置可能给子 Agent 很宽的工具面，RPC 接受 trustedHosts，sessions.repair 会递归改写 DSH Home 中旧日志且只保留首份 .bak，AGPL 和旧 peer 范围也需确认。先在独立 Profile 限制工具与深度，不把 trustedHosts 当用户登录，修复前完整备份 sessions，并在当前 DSH 版本做兼容验证。
summary:
  zh: 用可持久化的 Profile 管理 DSH 子 Agent，为不同任务配置模型、Persona、工具白名单/黑名单、最大委派深度和可继续或一次性后台模式。
