permissions:
  status: reviewed
  capabilities:
    - network_access
    - credentials
    - browser_control
  notes: 在 127.0.0.1:1456 提供 OAuth 控制页，在 127.0.0.1:1455 接收带 state 的回调；保存 access/refresh token、注入 DSH Credential，并默认启用托管搜索和图片工具，设置页可退出登录和调整模型/功能
  data_flow: 用户浏览器或设备码 → auth.openai.com OAuth/PKCE → 0600 原子凭据文件与 DSH Credential → ChatGPT Codex Responses/usage backend；模型提示、搜索词与图片提示会发送到 OpenAI，搜索结果、图片和额度摘要返回 DSH。
risk_level: high
verification:
  level: source_reviewed
  verified_on: 2026-08-22
  independent_review: true
  review_notes: 已审阅固定提交的 PKCE/state、设备码、loopback 控制/回调服务器、随机 CSRF、64KB 请求限制、0600/0700 原子写入、Token 刷新、用量、搜索和图片工具。敏感状态接口要求 localhost Origin 与 CSRF，凭据不会返回页面；但任意 localhost 端口均被视为本地 Origin，登录触发入口允许无 Origin，issuer/usageUrl 可配置，且插件依赖非公开 ChatGPT Codex 后端与消费订阅，存在服务条款、封号、协议变化和额度成本风险。只在个人受控主机使用，保持默认 OpenAI endpoint，不经代理公开 1455/1456，先核对账号政策并关闭不需要的搜索/图片功能。
summary:
  zh: 通过 ChatGPT/Codex OAuth 订阅向 DSH 提供 GPT 模型凭据、托管网页搜索、图片生成、模型可见性和订阅用量面板。
  en: Use a ChatGPT/Codex subscription in DeepSeek Harness with GPT models, image generation, web search, subscription quota reporting, model and feature controls, and browser or device-code OAuth sign-in.
