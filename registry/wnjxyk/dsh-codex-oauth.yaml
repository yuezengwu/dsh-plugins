  kind: plugin
  compatibility_status: declared
  compatibility_notes: 插件版本 0.4.2、MIT，要求 Node.js >=20，直接依赖 DSH rc.6 系列组件且 README 声明只在 DSH 0.1.0-rc.6 验证；本站完成固定提交静态审阅，未在当前 0.1.1-rc.2、真实 OpenAI 登录、Token 轮换、套餐限额或协议变更下运行
category: integration
topics:
  - model
