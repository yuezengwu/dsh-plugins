  data_flow: Session 名称、待审批原因、问题文本和最终回复前 80 字 → 当前浏览器的 Notification API → 操作系统通知中心；点击通知后聚焦现有窗口并打开对应 Session，无插件自有服务器和外部网络发送。
risk_level: medium
verification:
  level: source_reviewed
  verified_on: 2026-08-22
  independent_review: true
  review_notes: 已审阅固定提交的通知权限入口、Session 订阅、去重和点击跳转。功能仅在页面隐藏且浏览器权限已授予时运行，没有 fetch、Host API 或插件持久化；但系统通知会在锁屏或共享屏幕上显示 Session 名称、审批原因、问题文本或回复摘要，可能泄露任务内容。共享设备和敏感会话不要授予通知权限，或在操作系统中关闭锁屏预览。
summary:
  zh: 在 DSH Web 页面位于后台时，为工具审批、Agent 提问、轮次完成和后台 Session 完成发送浏览器桌面通知，并可点击跳回对应会话。
  en: Desktop notification reminders.
