  compatibility_notes: 插件版本 0.8.4，要求 Node.js 22 或更高，作者说明面向 DSH 0.1.0-rc.6；本站完成固定提交静态审阅，未使用真实消息平台账号、长轮询、Webhook 或远程审批进行端到端测试
