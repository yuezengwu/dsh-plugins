risk_level: medium
verification:
  level: source_reviewed
  verified_on: 2026-08-22
  independent_review: true
  review_notes: 已审阅固定提交的命令、投影、主/子 Agent 归属、价格匹配、费用持久化、设置读取和客户端压缩入口。插件不采集遥测且不读取模型凭据，但费用只是依据用户配置或内置价格的估算，Provider baseURL 会作为路由键进入客户端定价投影，持久化文件含 Session ID 与用量成本。不要把结果当作正式账单；自定义 Provider 应核对币种、时区和价格，并按本地敏感使用元数据保护 DSH Home。
summary:
  zh: 为 DSH 增加 /context 上下文用量卡片和可收起的实时悬浮环形图，展示 Token 组成、压缩收益、主/子 Agent 消耗与按模型估算费用。
  en: A right-side floating panel and /context command for DeepSeek Harness — a live donut chart of context token usage, allocation, and estimated cost.
