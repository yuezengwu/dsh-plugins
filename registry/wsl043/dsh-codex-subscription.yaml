  kind: plugin
  compatibility_status: declared
  compatibility_notes: 插件版本 1.2.0、MIT，要求 Node.js ^22.19 或 24+，声明兼容 DSH 0.1.0-rc.6/rc.7/rc.8 与 0.1.1-rc.1；本站完成固定提交静态审阅，未在当前 0.1.1-rc.2、真实 ChatGPT 账号、OAuth 刷新、SSE 长连接、图片生成或搜索计费下运行
category: integration
