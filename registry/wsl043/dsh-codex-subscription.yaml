permissions:
  status: reviewed
  capabilities:
    - filesystem_write
    - network_access
    - credentials
    - browser_control
    - session_data
  notes: 发起 OpenAI OAuth 登录并在 DSH credentials 保存访问/刷新令牌，调用 ChatGPT/Codex 模型、搜索、图片和 usage endpoint；可修改 DSH Web 搜索 Provider 与速度设置，并打开经过域名校验的外部登录地址
  data_flow: 本机 loopback RPC 登录 → OpenAI OAuth → 访问/刷新令牌进入 DSH Credential Ref；提示词、附件、搜索请求或图片生成参数与 Bearer Token → OpenAI/ChatGPT 服务 → 模型、搜索、图片或配额结果返回 DSH，浏览器只收到脱敏账户状态与用量投影。
risk_level: high
verification:
  level: source_reviewed
  verified_on: 2026-08-22
  independent_review: true
  review_notes: 已审阅固定提交的 OAuth Store 串行更新、旧凭据迁移、登录协调、URL 白名单、loopback authority RPC、SSE 模型适配、用量解析、搜索和图片工具。令牌没有回传浏览器，Provider 错误被收敛；但这是第三方社区集成而非 OpenAI 官方 DSH 插件，会处理高价值账号令牌并把会话内容交给 OpenAI，订阅可用范围、费用和服务条款也可能变化。使用独立 Profile 与最小权限账号，保持 DSH loopback，确认账户政策，定期退出并轮换会话；不要把目录收录理解为 OpenAI 或 DeepSeek 背书。
summary:
  zh: 把用户自己的 ChatGPT/Codex 订阅通过 OAuth 接入 DSH，提供 Codex 模型、图片生成、Web 搜索、配额查询、速度偏好和登录管理。
  en: Built-in ChatGPT OAuth provider for Codex models, selectable subscription web search, backend quota for standard Codex and Spark, and a DSH settings UI; no API key or separate Codex installation required.
