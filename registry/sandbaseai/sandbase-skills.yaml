  compatibility_status: declared
  compatibility_notes: 插件版本 0.3.5，以 DSH filesystem Skill provider 挂载 marketing 与 research 目录，未声明具体 DSH peer 版本；本站完成固定提交静态审阅和代表性 Skill 抽查，未逐一运行 88 个 Skill、SandBase MCP、外部数据源或离线验证器
category: knowledge
