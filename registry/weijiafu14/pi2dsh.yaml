risk_level: high
verification:
  level: source_reviewed
  verified_on: 2026-08-29
  independent_review: true
  review_notes: 对比旧固定提交后复核了 0.23.0 新增的双版本预检、模型登录卡、OAuth、MCP、代码导航、展示面和子 Agent 桥接。peer 范围包含 0.1.2-alpha.1 只代表作者声明兼容；Pi 扩展仍会作为宿主代码运行，可能读写文件、执行命令或访问外部服务，安装前应逐个审查扩展并先运行作者的 inspect 检查。
summary:
