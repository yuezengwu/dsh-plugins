  data_flow: Claude Provider 表单、endpoint、模型参数和 Credential Ref → DSH Settings/Credentials → 带 x-api-key 与 anthropic-version 的外部 /v1/models 分页探测 → 模型目录返回设置页；保存后的聊天配置由 DSH 原生 Provider 读取并向对应服务发送对话。
risk_level: high
verification:
  level: source_reviewed
  verified_on: 2026-08-22
  independent_review: true
  review_notes: 已审阅固定提交的 Host 注册、模型探测、凭据解析和 Web 配置入口。插件当前不再拦截或改写聊天请求，只写入 DSH 原生字段；密钥优先通过 credentials seam 按引用解析，不在模型列表结果中回显。但自定义 baseURL 会收到 API Key，模型探测和后续聊天可能把凭据及内容交给第三方兼容服务。优先使用 Anthropic 官方 HTTPS endpoint，第三方地址使用独立限额 Key，保存前核对域名和 Provider ID。
summary:
