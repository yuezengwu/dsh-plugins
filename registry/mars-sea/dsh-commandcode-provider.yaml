dsh:
  kind: plugin
  compatibility_status: declared
  compatibility_notes: 插件版本 0.6.2，要求 Node.js >=22，peer 依赖覆盖 DSH 0.1.0-rc.6 或 0.1.1-rc.1 相关组件；本站完成固定提交静态审阅，未使用真实 Command Code 账号验证模型、计费和轮换
category: infrastructure
topics:
  - model
  - infrastructure
permissions:
  status: reviewed
  capabilities:
    - filesystem_read
    - command_execution
    - network_access
    - credentials
    - session_data
  notes: 读取 DSH 凭据库中的一个或多个 Command Code API Key，并可兜底读取 ~/.commandcode/auth.json；向用户配置或默认的 Command Code API 发送会话请求、图片和账户用量查询
  data_flow: DSH 消息、工具上下文和可选图片 → Command Code Provider 适配器 → 当前账户 API Key 与 api.commandcode.ai 或用户配置端点 → 流式模型结果和用量返回 DSH；模型目录缓存写入本机。
risk_level: high
verification:
  level: source_reviewed
  verified_on: 2026-08-22
  independent_review: true
  review_notes: 已审阅固定提交的 Provider 入口、账户解析、请求适配、模型缓存、用量端点和 Web 设置。默认网络目标是 Command Code API 且无插件遥测，Key 每次从凭据引用解析；但自定义 apiBase 决定消息和凭据发送位置，多账户轮换还会持有多个账号权限，官方服务协议、模型和套餐可能变化。只使用可信 HTTPS 端点，给每个账号设置可撤销 Key，并先用非敏感会话验证。
summary:
  zh: 为 DSH 注册 Command Code 模型 Provider，提供实时模型目录、账户用量、多账户轮换、套餐外模型过滤和图片能力标记。
  en: "Unofficial Command Code LLM provider: registers a `commandcode` route with a live model catalog and reasoning-effort support."
