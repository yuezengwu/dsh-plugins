  data_flow: DSH 配置、插件代码和凭据文件 → 本机内容寻址快照与脱敏副本/私密 vault → 用户预览并确认恢复 → 先建后悔快照再覆盖目标文件；可选依赖同步调用 pnpm，结果写入回滚日志。
risk_level: high
verification:
  level: source_reviewed
  verified_on: 2026-08-22
  independent_review: true
  review_notes: 已审阅固定提交的 Host、客户端、快照、密钥脱敏、vault、恢复、安全模式、离线 PowerShell 和依赖同步路径。真实凭据会留在本机 vault，导出件使用脱敏值，但快照根本身仍是敏感数据；恢复和清理会修改或删除启动关键文件，syncDeps 还会执行包管理器。使用前应另做系统级备份，保持默认依赖不同步，并只在逐项核对恢复预览后操作。
summary:
  zh: 为 DSH 配置和插件代码建立自动或手动快照，支持预览差异、撤销、重做、安全模式、崩溃急救、导入导出以及 DSH 无法启动时的离线 CLI/GUI。
  en: "Undo/redo & rollback system for DSH: every config change is auto-snapshotted; undo/redo/restore to any version from the WebUI or the offline CLI/GUI tools (works even when DSH fails to boot)."
