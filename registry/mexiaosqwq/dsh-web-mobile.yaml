  compatibility_notes: 插件版本 2.0.0，客户端 peer 依赖明确覆盖 DSH 0.1.0-rc.6 以及 0.1.1-rc.0 至 <0.2.0；本站完成固定提交静态审阅，未对全部手机浏览器、桌面壳、横竖屏和第三方 UI 插件组合进行真机测试
