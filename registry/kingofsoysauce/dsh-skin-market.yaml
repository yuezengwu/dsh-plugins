  review_notes: 已审阅固定提交的目录、写操作路由、同源检查、Profile 修改、生命周期、自更新和重启门禁。所有安装/卸载/更新 POST 都要求 Origin 与 Host 同源，目录要求完整 Commit、包名、rowId 和许可证；但安装皮肤仍会执行第三方 npm 包及可能的生命周期脚本，市场可修改 Loader 并重启宿主，同源不等同于用户身份。不要把 DSH Web 暴露到不可信网络，只安装已审阅皮肤，并在重启前保存会话和备份 Profile。
summary:
