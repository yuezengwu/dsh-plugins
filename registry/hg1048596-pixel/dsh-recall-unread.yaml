permissions:
  status: reviewed
  capabilities:
    - session_data
    - ui_injection
  notes: 客户端读取当前 Session queue 的未读 steering 预览，Host 通过私有 recall RPC 获取目标 Agent 并直接调用 agent.inbox.remove(itemId) 移除仍处于 pending 的消息
  data_flow: 当前 Session 的未读 steering 队列 → 输入区本地预览 → 用户点击撤回并通过 host.call 发送 sessionId/itemId → 对应 Agent inbox 删除 pending 项；已经被模型领取的消息拒绝撤回。
risk_level: medium
verification:
  level: source_reviewed
  verified_on: 2026-08-22
  independent_review: true
  review_notes: 已审阅固定提交的 Host 私有 RPC、Session/Agent 定位和 Web dock。实现只删除仍未读取的 inbox 项，不改历史事件或已开始的模型回合，且失败会明确提示；但没有二次确认，全部撤回遇到并发领取时可能只完成部分操作，包也未锁定 DSH peer 版本。只把它当作发送队列纠错工具，不要依赖它撤销已经提交给模型或外部工具的内容。
summary:
  zh: 在 DSH 输入区显示模型尚未读取的 steering 消息，并允许逐条或全部撤回，避免排队中的补充说明继续进入 Agent。
  en: Adds a strip above the composer to recall sent-but-unread (steering) text messages before the model reads them.
