  compatibility_notes: 插件版本 1.1.0，提供 DSH bundle 与 Web client，但未声明 Node 或具体 DSH peer 范围；本站完成固定提交静态审阅，未在当前基线运行消息竞争、批量撤回或多标签页测试
category: interface
