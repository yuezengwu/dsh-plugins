  compatibility_notes: 插件版本 0.2.5、MIT，未声明 Node.js 或 DSH peer 版本，通过 Cordis Patch 注入 DSH Web 客户端运行时与布局服务；本站完成固定提交静态审阅，未在当前 0.1.1-rc.2、iOS Safari、Android Chrome、横屏、软键盘或辅助功能下做真实设备回归
