license:
  spdx: MIT
  status: clear
dsh:
  kind: plugin
  compatibility_status: declared
  compatibility_notes: 插件版本 0.8.1，明确要求 DSH >=0.1.0-rc.7，peer 依赖 dsh-settings ^0.1.0-rc.7；本站完成固定提交静态审阅，未用真实网络故障、不可逆工具、副作用重试或宿主崩溃恢复进行长时间测试
category: agent
topics:
  - ui
  - agent
permissions:
  status: reviewed
  capabilities:
    - session_data
    - agent_orchestration
  notes: 全局监听 Session/Agent 事件并能调用 agent.followup、agent.cancel，自动开启新回合或打断疑似循环；配置会写入 settings.yaml，通知动作路由还能立即继续或暂停指定 Session
  data_flow: DSH turn/end、agent-error、工具结果和运行事件 → 临时/永久错误分类、冷却、循环与幂等判断 → 配置的继续/换路提示 → 原 Agent inbox 和新模型/工具回合；统计与暂停状态保存在进程内并通过本机 SSE 提供给页面。
risk_level: high
verification:
  level: source_reviewed
  verified_on: 2026-08-22
  independent_review: true
  review_notes: 已审阅固定提交的单实例 Host 引擎、错误分类、退避、启动扫描、工具幂等提示、循环检测、Session 排除和 Web 状态桥。它拒绝用户主动停止、blocked、子 Agent、排队中和永久认证/额度错误，并限制连续次数；但模型无法保证识别所有外部副作用，自动重试 git push、部署、付款等动作仍可能重复，循环误判还会取消正常长任务。高副作用 Profile 默认关闭该插件，保持小的 maxConsecutive，扩大 cooldown，并定期查看审计统计。
summary:
  zh: 在模型网络错误、超时、5xx、429、输出上限或检测到重复循环时自动向 DSH Agent 发送继续提示，提供错误分类、退避、幂等护栏、暂停、通知和统计。
  en: "Auto-resumes interrupted DSH Web requests: sends a queued 「继续」 after network, timeout or host-crash failures, with error classification, adaptive backoff, templated continue text and browser notifications."
