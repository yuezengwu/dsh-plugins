  review_notes: 已审阅固定提交的安全默认值、调用关联、Shell 解析、高风险规则、Reviewer 隔离/脱敏、严格输出和 loopback 设置 RPC。安装本身不会自动批准，失败、超时、歧义和高风险均转人工；但任何自动审批器都可能漏判新命令、参数、wrapper 或平台差异，且当前 peer 精确锁定 rc.1。仅添加最窄的只读前缀，重要仓库保留模型复核和人工抽查，在 0.1.1-rc.2 安装前先做隔离兼容测试，绝不把它等同于安全证明。
summary:
  zh: 为 DSH Shell 与 PowerShell 沙箱扩权提供受控自动审批：先做固定高风险检查和用户字面前缀匹配，再可选调用无工具模型复核，不确定时回到人工审批。
